<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password Entry Page</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #121212; /* Dark background */
      color: white;
    }
    .card {
      background-color: #1f1f1f;
      color: white;
      border: none;
    }
  </style>
</head>
<body>

  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card p-4 shadow" style="min-width: 350px;">
      <h4 class="text-center mb-3">Enter Your Password</h4>

      <!-- Password-only Form -->
      <form id="loginForm">
        <!-- Password Field -->
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter password" required>
        </div>

        <!-- Submit Button -->
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
      </form>

      <!-- Error Message -->
      <div class="text-danger mt-2 d-none" id="errorMessage">Incorrect password. Try again.</div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Redirect Logic -->
  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault(); // Prevent form from submitting the traditional way
      
      const correctPassword = "admin123"; // ✅ Change this to your desired password
      const userPassword = document.getElementById("password").value;
      const errorDiv = document.getElementById("errorMessage");

      if (userPassword === correctPassword) {
        // Redirect to index.html if password matches
        window.location.href = "index.html";
      } else {
        // Show error message
        errorDiv.classList.remove("d-none");
      }
    });
  </script>
  <script>
    const form = document.getElementById("searchForm");
    const input = document.getElementById("searchInput");
    const searchNav = document.getElementById("searchNav");
    const searchCount = document.getElementById("searchCount");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
  
    let matches = [];        // Stores matched elements
    let currentIndex = -1;   // Tracks which match is active
  
    form.addEventListener("submit", function (e) {
      e.preventDefault();
  
      const query = input.value.trim().toLowerCase();
      const allMessages = document.querySelectorAll(".text");
  
      // Reset
      matches.forEach(msg => msg.classList.remove("search-active"));
      matches = [];
      currentIndex = -1;
  
      // Search and highlight matches
      allMessages.forEach(msg => {
        const content = msg.textContent.toLowerCase();
  
        if (query && content.includes(query)) {
          msg.style.backgroundColor = "#ffff00"; // Yellow for match
          matches.push(msg);
        } else {
          msg.style.backgroundColor = ""; // Clear old highlights
        }
      });
  
      // Show search nav only if there are matches
      if (matches.length > 0) {
        currentIndex = 0;
        scrollToMatch(currentIndex);
        searchNav.style.display = "flex";
      } else {
        searchNav.style.display = "none";
      }
  
      updateCounter();
    });
  
    // Scroll and style the current match
    function scrollToMatch(index) {
      matches.forEach((msg, i) => {
        msg.classList.toggle("search-active", i === index); // Add orange border to active one
      });
  
      if (matches[index]) {
        matches[index].scrollIntoView({ behavior: "smooth", block: "center" });
      }
    }
  
    function updateCounter() {
      searchCount.textContent = matches.length > 0
        ? `${currentIndex + 1} of ${matches.length}`
        : `0 of 0`;
    }
  
    // Button events
    nextBtn.addEventListener("click", () => {
      if (matches.length > 0) {
        currentIndex = (currentIndex + 1) % matches.length;
        scrollToMatch(currentIndex);
        updateCounter();
      }
    });
  
    prevBtn.addEventListener("click", () => {
      if (matches.length > 0) {
        currentIndex = (currentIndex - 1 + matches.length) % matches.length;
        scrollToMatch(currentIndex);
        updateCounter();
      }
    });
  </script>
  

 </body>
</html>
